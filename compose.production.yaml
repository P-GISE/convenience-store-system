name: convenience-store
services:
  app:
    image: convenience-store:${IMAGE_TAG:?Set IMAGE_TAG to the reviewed commit}
    build: .
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://db:3306/convenience?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: convenience
      DB_PASSWORD: ${DB_PASSWORD:?Set a dedicated DB_PASSWORD}
    ports:
      - "127.0.0.1:${APP_PORT:?Set the approved local APP_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: convenience
      MYSQL_USER: convenience
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set a dedicated DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a distinct MYSQL_ROOT_PASSWORD}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u convenience -D convenience -Nse 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  database:
