<!-- src/main/resources/templates/signup.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <style>
        /* 전체 페이지 스타일링 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 회원가입 폼 스타일링 */
        form {
            max-width: 400px;
            width: 100%;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            transition: box-shadow 0.3s ease;
        }

        form:hover {
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333333;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555555;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 20px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        input:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .error-message {
            color: #d9534f;
            margin-top: -15px;
            margin-bottom: 15px;
            font-size: 0.9em;
            display: block;
            text-align: left;
        }

        /* 회원가입 링크 스타일링 */
        .signup-link {
            text-align: center;
            margin-top: 20px;
        }

        .signup-link a {
            color: #007bff;
            text-decoration: none;
            font-weight: 500;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        // 간단한 클라이언트 사이드 폼 유효성 검사 (비밀번호 확인)
        function validateForm() {
            const password = document.forms["signupForm"]["password"].value;
            const confirmPassword = document.forms["signupForm"]["confirmPassword"].value;
            if (password !== confirmPassword) {
                alert("비밀번호가 일치하지 않습니다.");
                return false;
            }
            return true;
        }
    </script>
</head>
<body>
<form name="signupForm" th:action="@{/signup}" method="post" th:object="${userRegistrationRequest}" onsubmit="return validateForm()">
    <h2>회원가입</h2>
    <div>
        <label for="username">사용자명:</label>
        <input type="text" id="username" th:field="*{username}" required />
        <span th:if="${#fields.hasErrors('username')}"
              th:errors="*{username}" class="error-message"></span>
    </div>
    <div>
        <label for="password">비밀번호:</label>
        <input type="password" id="password" th:field="*{password}" required />
        <span th:if="${#fields.hasErrors('password')}"
              th:errors="*{password}" class="error-message"></span>
    </div>
    <div>
        <label for="confirmPassword">비밀번호 확인:</label>
        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required />
        <span th:if="${#fields.hasErrors('confirmPassword')}"
              th:errors="*{confirmPassword}" class="error-message"></span>
    </div>
    <div>
        <button type="submit">회원가입</button>
    </div>
</form>
<div th:if="${param.error}">
    <p style="color:red;"
       th:text="${#strings.contains(param.error, 'password_mismatch') ? '비밀번호가 일치하지 않습니다.' : '사용자명이 이미 사용 중입니다.'}">
    </p>
</div>
<div th:if="${param.signup_success}">
    <p style="color:green;">회원가입이 완료되었습니다. 로그인 해주세요.</p>
</div>
</div>
</body>
</html>
