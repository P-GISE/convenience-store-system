<!-- src/main/resources/templates/dashboard.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>대시보드</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f0f2f5; }
    .container { margin-top: 40px; margin-bottom: 40px; }
    .status-card { margin-bottom: 20px; }
    .table-container { overflow-x: auto; }
    .navbar-brand { font-weight: bold; }
  </style>
</head>
<body>
<!-- 네비게이션 바 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" th:href="@{/}">재고 관리 시스템</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/inventory}">재고 확인</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/orders}">주문 관리</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/dashboard}">대시보드</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/stock-transactions}">발주 완료 내역</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/logout}">로그아웃</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- 메인 콘텐츠 -->
<div class="container">
  <h2 class="text-center mb-4">대시보드</h2>

  <!-- 성공 메시지 표시 -->
  <div th:if="${param.success}" class="alert alert-success" role="alert">
    주문 상태가 성공적으로 업데이트되었습니다.
  </div>

  <!-- 오류 메시지 표시 -->
  <div th:if="${param.error}" class="alert alert-danger" role="alert">
    <p th:text="
            ${param.error == 'insufficient_inventory'} ? '재고가 부족합니다.' :
            (${param.error == 'inventory_not_found'} ? '해당 발주 종류의 재고를 찾을 수 없습니다.' :
            (${param.error == 'unexpected_error'} ? '예기치 않은 오류가 발생했습니다.' : param.error))
        "></p>
  </div>

  <!-- 상태별 통계 카드 -->
  <div class="row">
    <div class="col-md-3">
      <div class="card text-white bg-info status-card">
        <div class="card-body">
          <h5 class="card-title">접수</h5>
          <p class="card-text" th:text="${receivedCount}">0</p>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-white bg-warning status-card">
        <div class="card-body">
          <h5 class="card-title">준비</h5>
          <p class="card-text" th:text="${preparationCount}">0</p>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-white bg-secondary status-card">
        <div class="card-body">
          <h5 class="card-title">출발</h5>
          <p class="card-text" th:text="${departedCount}">0</p>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-white bg-success status-card">
        <div class="card-body">
          <h5 class="card-title">도착</h5>
          <p class="card-text" th:text="${arrivedCount}">0</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 주문 목록 테이블 -->
  <div class="table-container">
    <table class="table table-striped table-bordered">
      <thead class="table-dark">
      <tr>
        <th>주문 ID</th>
        <th>발주 종류</th>
        <th>수량</th>
        <th>주문 날짜</th>
        <th>상태</th>
        <th>상태 변경</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="order : ${orders}">
        <td th:text="${order.id}">1</td>
        <td th:text="${order.orderType.name}">종류</td>
        <td th:text="${order.quantity}">10</td>
        <td th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm:ss')}">2023-10-07</td>
        <td th:text="${order.status}">RECEIVED</td>
        <td>
          <form th:action="@{/dashboard/updateStatus}" method="post" class="d-flex">

            <input type="hidden" name="orderId" th:value="${order.id}" />
            <select name="status" class="form-select me-2" required>
              <option value="" disabled selected>상태 선택</option>
              <option value="RECEIVED" th:selected="${order.status == 'RECEIVED'}">접수</option>
              <option value="PREPARATION" th:selected="${order.status == 'PREPARATION'}">준비</option>
              <option value="DEPARTED" th:selected="${order.status == 'DEPARTED'}">출발</option>
              <option value="ARRIVED" th:selected="${order.status == 'ARRIVED'}">도착</option>
            </select>
            <button type="submit" class="btn btn-sm btn-primary">변경</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
