<!-- src/main/resources/templates/stock_transactions.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>발주 완료 내역</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container { margin-top: 40px; }
        .navbar-brand { font-weight: bold; }
    </style>
</head>
<body>
<!-- 네비게이션 바 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">재고 관리 시스템</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/inventory}">재고 확인</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/orders}">주문 관리</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">대시보드</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/stock-transactions}">발주 완료 내역</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/logout}">로그아웃</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- 메인 콘텐츠 -->
<div class="container">
    <h2 class="text-center mb-4">발주 완료 내역</h2>

    <!-- 재고 트랜잭션 테이블 -->
    <div class="table-responsive">
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>주문 ID</th>
                <th>발주 종류</th>
                <th>수량</th>
                <th>발주 날짜</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="transaction : ${transactions}">
                <td th:text="${transaction.id}">1</td>
                <td th:text="${transaction.order.id}">1001</td>
                <td th:text="${transaction.orderType.name}">환타</td>
                <td th:text="${transaction.quantity}">50</td>
                <td th:text="${#temporals.format(transaction.transactionDate, 'yyyy-MM-dd HH:mm:ss')}">2024-12-07 15:30:00</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
