name: Build and synthetic deployment check
on:
  pull_request:
  push:
    branches: [main, codex/deployment-prep-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    uses: ./.github/workflows/security-gate.yml
  verify:
    needs: ["security"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_TAG: ci
      APP_PORT: '18083'
      DB_PASSWORD: synthetic-app-password
      MYSQL_ROOT_PASSWORD: synthetic-root-password
      COMPOSE_PROJECT_NAME: convenience-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - name: Verified event deployment workflow regressions
        run: python3 scripts/deploy/test_event_workflow.py
      - name: Tests and JAR
        run: bash gradlew --no-daemon test bootJar
      - name: Block unsafe built Java runtime before image or release packaging
        run: |
          python3 -m unittest discover -s scripts/security -p test_resolved_gradle.py
          bash scripts/security/scan-built-java.sh build/libs
      - name: Required environment fails closed
        run: |
          if env -u DB_PASSWORD docker compose -f compose.production.yaml config -q; then
            echo 'Missing database secret was accepted' >&2
            exit 1
          fi
      - name: Build image
        run: docker compose -f compose.production.yaml build --build-arg REVISION_SHA="$GITHUB_SHA"
      - name: Synthetic MySQL runtime regression
        run: bash scripts/deployment-smoke.sh
      - name: Capture container logs
        if: always()
        run: |
          mkdir -p build/deployment-evidence
          docker compose -f compose.production.yaml logs --no-color > build/deployment-evidence/containers.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: deployment-evidence
          path: |
            build/test-results
            build/reports/tests
            build/deployment-evidence
      - name: Remove only this CI database
        if: always()
        run: docker compose -f compose.production.yaml down -v
      - name: Package verified immutable image
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          test "$(docker image inspect convenience-store:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          docker tag convenience-store:ci convenience-store:$GITHUB_SHA
          mkdir -p release
          docker save convenience-store:$GITHUB_SHA | gzip > release/image.tar.gz
          (cd release && sha256sum image.tar.gz > image.sha256)
          echo "$GITHUB_SHA" > release/revision.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name == 'push'
        with:
          name: five-sites-app-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
