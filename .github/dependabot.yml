version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  target-branch: main
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 2
  groups:
    actions:
      patterns:
      - '*'
- package-ecosystem: docker
  directory: /
  target-branch: main
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 2
  groups:
    compatible:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: gradle
  directory: /
  target-branch: main
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 2
  groups:
    compatible:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: gradle
  directory: /ordersystem2
  target-branch: main
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 2
  groups:
    compatible:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
