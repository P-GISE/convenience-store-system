<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('점주 회원가입')}"></head>
<body class="auth-page">
<main class="auth-card">
    <h1 class="auth-title">점주 회원가입</h1>
    <p class="auth-subtitle">가입 후 본사에 필요한 재고를 요청할 수 있습니다.</p>

    <form name="signupForm" th:action="@{/signup}" method="post" th:object="${userRegistrationRequest}">
        <input type="hidden" name="_csrf" th:value="${csrfToken}" />

        <div class="mb-3">
            <label for="username" class="form-label">사용자명</label>
            <input type="text" id="username" th:field="*{username}" class="form-control"
                   autocomplete="username" required aria-describedby="usernameError" />
            <div id="usernameError" th:if="${#fields.hasErrors('username')}" class="field-error mt-1"
                 th:errors="*{username}">사용자명 오류</div>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" id="password" th:field="*{password}" class="form-control"
                   autocomplete="new-password" required aria-describedby="passwordHelp passwordError" />
            <div id="passwordHelp" class="form-text">6자 이상으로 입력하세요.</div>
            <div id="passwordError" th:if="${#fields.hasErrors('password')}" class="field-error mt-1"
                 th:errors="*{password}">비밀번호 오류</div>
        </div>

        <div class="mb-3">
            <label for="confirmPassword" class="form-label">비밀번호 확인</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control"
                   autocomplete="new-password" required aria-describedby="confirmPasswordError" />
            <div id="confirmPasswordError" th:if="${#fields.hasErrors('confirmPassword')}" class="field-error mt-1"
                 th:errors="*{confirmPassword}">비밀번호 확인 오류</div>
        </div>

        <div class="alert alert-info" role="status">
            공개 회원가입은 점주 계정으로만 생성됩니다. 본사 계정은 관리자 또는 데모 계정을 사용합니다.
        </div>

        <button type="submit" class="btn btn-primary w-100">점주 계정 만들기</button>
    </form>

    <p class="text-center mt-3 mb-0">
        이미 계정이 있나요?
        <a th:href="@{/login}">로그인</a>
    </p>
</main>
</body>
</html>
