<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('편의점 재고 보충')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('home')}"></nav>

<main class="app-shell landing-shell">
  <section class="landing-panel">
    <div>
      <p class="page-kicker">Convenience Operations MVP</p>
      <h1 class="landing-title">고객 주문부터 재고 보충까지 이어지는 편의점 운영 시스템</h1>
      <p class="landing-copy">
        고객은 온라인으로 픽업/배달 주문을 넣고, 점주는 매장 주문과 본사 발주를 함께 관리합니다.
      </p>
      <div class="landing-actions">
        <a th:href="@{/shop}" class="btn btn-primary">고객 주문하기</a>
        <a th:href="@{/login}" class="btn btn-primary">로그인</a>
        <a th:href="@{/signup}" class="btn btn-outline-primary">점주 회원가입</a>
      </div>
    </div>
    <ul class="workflow-list" aria-label="업무 흐름">
      <li><strong>1. 고객 주문</strong><br>판매 재고 안에서 픽업 또는 배달 주문을 접수합니다.</li>
      <li><strong>2. 매장 처리</strong><br>점주가 고객 주문을 준비, 픽업 대기, 배달 중, 완료로 처리합니다.</li>
      <li><strong>3. 재고 보충</strong><br>부족한 품목은 본사 발주 요청으로 다시 채웁니다.</li>
    </ul>
  </section>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
